<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIO - Cart</title>
    <link rel="stylesheet" href="./cart.css">
    <link rel="stylesheet" href="../assets/css/lumio-integration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3C1A8D"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg><span>
            <a href="../index.html">
                <h1>LUMIO</h1>
            </a>
        </span>

        <ul class="links">
            <li class="links"><a href="../index.html">Home</a></li>
            <li class="links"><a href="#">Shop</a></li>
            <li class="links"><a href="./categories.html">Categories</a></li>
            <li class="links"><a href="./about.html">About</a></li>

            <div class="icons">
                <li>
                    <a href="./cart.html"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg></a>
                </li>
                <li>
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </li>
            </div>

        </ul>
    </div>

    <section class="banner">
        <h1>Your Cart</h1>
        <p>Review your items and proceed to checkout</p>
    </section>


    <!-- CART MAIN CONTENT SECTION -->
    <main class="cart-container">
        <div class="cart-layout">

            <!-- LEFT COLUMN: CART ITEMS -->
            <section class="cart-card">
                <!-- Card Header -->
                <div class="card-header">
                    <h2>Cart Items (<span id="cart-count">2</span>)</h2>
                    <button class="clear-cart-btn" onclick="clearCart()">
                        <span>Clear Cart</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>

                <!-- Card Body / List of Items (Rendered dynamically from LumioCart) -->
                <div class="cart-items-list" id="cart-items-list">
                    <div class="lumio-loading-spinner">
                        <div class="lumio-spinner-circle"></div>
                        <span>Loading your cart...</span>
                    </div>
                </div>
            </section>

            <!-- RIGHT COLUMN: ORDER SUMMARY -->
            <aside class="summary-card">
                <!-- Header -->
                <div class="card-header">
                    <h2>Order Summary</h2>
                </div>

                <!-- Body -->
                <div class="summary-body">
                    <div class="summary-row">
                        <span class="label">Subtotal</span>
                        <span class="value" id="summary-subtotal">₹7,498</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Shipping</span>
                        <span class="value text-green">Free</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">Taxes (18%)</span>
                        <span class="value" id="summary-tax">₹1,350</span>
                    </div>

                    <hr class="summary-divider">

                    <div class="summary-row total-row">
                        <span class="total-label">Total</span>
                        <span class="total-value" id="summary-total">₹8,848</span>
                    </div>

                    <!-- Checkout Button -->
                    <button class="checkout-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Proceed to Checkout</span>
                        <span class="arrow">&rarr;</span>
                    </button>

                    <!-- OR divider -->
                    <div class="or-separator">
                        <span>OR</span>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <!-- Full-Stack Backend Integration Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/lumio-ui.js"></script>
    <script src="../assets/js/cart-page.js"></script>
</body>

</html>
