<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIO - Categories</title>
  <link rel="stylesheet" href="./categories.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../assets/css/lumio-integration.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="header">
      <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3C1A8D"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg><span>
        <a href="../index.html"><h1>LUMIO</h1></a>
      </span>
    <ul class="links">
      <li class="links"><a href="../index.html">Home</a></li>
      <li class="links"><a href="./home.html">Shop</a></li>
      <li class="links"><a href="./categories.html">Categories</a></li>
      <li class="links"><a href="./about.html">About</a></li>

      <div class="icons">
        <li>
          <a href="./cart.html"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg></a>
        </li>
        <li>
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </li>
      </div>

    </ul>
  </div>

  <section class="main-content" style="padding-top: 30px;">
    <h1>All Categories</h1>
    <p style="text-align: center; color: #64748b; font-size: 1.05rem; margin-top: -10px; margin-bottom: 30px;">
      Choose a department to browse live inventory
    </p>

    <div class="rows">
      <div class="home">
        <h2>Home Essentials</h2>
        <a href="./home.html?category=Home Essentials"><img src="../assets/images/home.png" alt="Home Essentials"></a>
      </div>
      <div class="groceries">
        <h2>Groceries</h2>
        <a href="./home.html?category=Groceries"><img src="../assets/images/groceries.jpg" alt="Groceries"></a>
      </div>
      <div class="stationery">
        <h2>Stationery Items</h2>
        <a href="./home.html?category=Stationery Items"><img src="../assets/images/stationery.png" alt="Stationery Items"></a>
      </div>
      <div class="pet">
        <h2>Pet Supplies</h2>
        <a href="./home.html?category=Pet Supplies"><img src="../assets/images/pets.png" alt="Pet Supplies"></a>
      </div>
      <div class="toys">
        <h2>Toys</h2>
        <a href="./home.html?category=Toys"><img src="../assets/images/toys.png" alt="Toys"></a>
      </div>
      <div class="food_drinks">
        <h2>Food and Drinks</h2>
        <a href="./home.html?category=Food and Drinks"><img src="../assets/images/food_drinks.jpg" alt="Food and Drinks"></a>
      </div>
    </div>
  </section>

  <!-- Live Category Products Section -->
  <section class="main-content" style="max-width: 1320px; margin: 40px auto 80px auto; padding: 0 30px;">
    <h1 style="font-size: 2rem;">Products in Database</h1>
    <div class="catalog-grid" id="catalog-grid" data-category="All" style="margin-top: 25px;">
      <div class="lumio-loading-spinner">
        <div class="lumio-spinner-circle"></div>
        <span>Loading products from database...</span>
      </div>
    </div>
  </section>

  <!-- Full-Stack Backend Integration Scripts -->
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/lumio-ui.js"></script>
  <script src="../assets/js/catalog.js"></script>
</body>

</html>
